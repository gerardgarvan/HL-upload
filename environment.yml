# HL data loading & cleaning environment
# Extends HL-EDA base env with Polars and DuckDB for CSV-to-Parquet pipeline
#
# DRAFT: This spec lists target packages. After installation on HPC, run:
#   mamba env export --no-builds > environment.yml
# to capture exact resolved versions.

name: hl-eda

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pandas>=2.2
  - pyarrow>=18.0
  - polars
  - duckdb
  - jupyter
  - matplotlib>=3.9
  - seaborn>=0.13
  - pip
  - pip:
    - jinja2>=3.1
    - tabulate
    - pytest
    - ruff
    - pre-commit

# Optional validation dependencies (not required for Phase 2 checkpoint validation)
# Uncomment if Phase 3 requires deep value validation beyond plain Polars dtype checks:
#   - pip:
#     - pandera>=0.20  # Statistical profiling, value constraints, complex cross-column validation
#     - pydantic>=2.0  # Complex config validation with custom validators (current pathlib checks sufficient)
