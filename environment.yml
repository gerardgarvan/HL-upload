# HL Data Pipeline - Conda Environment Specification
#
# This is the environment spec for the HL data loading and cleaning pipeline.
# To set up the environment, run:
#   conda env create -f environment.yml
#
# After environment creation, you can generate a lock file for exact reproduction:
#   conda env export --no-builds > environment_lock.yml

name: hl-eda

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pandas>=2.2
  - pyarrow>=18.0
  - polars
  - duckdb
  - jupyter
  - matplotlib>=3.9
  - seaborn>=0.13
  - pip
  - pip:
    - jinja2>=3.1
    - tabulate
    - pytest
    - ruff
    - pre-commit
